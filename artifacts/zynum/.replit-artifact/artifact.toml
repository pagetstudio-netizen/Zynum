kind = "web"
previewPath = "/"
title = "ZyNum - Virtual Numbers"
version = "1.0.0"
id = "artifacts/zynum"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18533
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/zynum run dev"

[services.env]
PORT = "18533"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/zynum", "run", "build"]
publicDir = "artifacts/zynum/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
