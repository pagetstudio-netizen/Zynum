openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ZyNum API - Virtual Numbers Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Authentication operations
  - name: numbers
    description: Virtual number operations
  - name: orders
    description: Order history operations
  - name: balance
    description: Balance and account operations
  - name: services
    description: Available services and countries
  - name: developer
    description: Developer API endpoints

paths:
  /v1/auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is unverified, banned, or blocked by an access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin second-factor verification is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout user
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/services:
    get:
      operationId: getServices
      tags: [services]
      summary: Get available services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesResponse"

  /v1/countries:
    get:
      operationId: getCountries
      tags: [services]
      summary: Get available countries
      parameters:
        - name: service
          in: query
          required: false
          schema:
            type: string
            default: telegram
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountriesResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/operators:
    get:
      operationId: getOperators
      tags: [services]
      summary: Get available operators
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - name: service
          in: query
          required: true
          schema:
            type: string
        - name: country
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of operators for the service and country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorsResponse"
        "400":
          description: Required query parameters are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/buy:
    post:
      operationId: buyNumber
      tags: [numbers]
      summary: Buy a virtual number
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyNumberRequest"
      responses:
        "200":
          description: Number purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Validation or purchase error, including insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Number unavailable or purchase conflicts with current availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Purchase persistence failed and provider cancellation could not be confirmed; do not retry blindly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/check/{orderId}:
    get:
      operationId: checkSms
      tags: [numbers]
      summary: Check SMS for an order
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SMS status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsStatusResponse"
        "400":
          description: Invalid order identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Refund handling is still pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckRefundPendingResponse"

  /v1/orders:
    get:
      operationId: getOrderHistory
      tags: [orders]
      summary: Get order history
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderHistoryResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cancel/{orderId}:
    post:
      operationId: cancelOrder
      tags: [numbers]
      summary: Cancel an order
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOrderResponse"
        "400":
          description: Cancellation request is invalid for the order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found for the current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order cannot be canceled in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Refund handling is still pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/finish/{orderId}:
    post:
      operationId: finishOrder
      tags: [numbers]
      summary: Finish an order
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found for the current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order cannot be finished in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Order finish could not be confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/balance:
    get:
      operationId: getBalance
      tags: [balance]
      summary: Get balance
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      responses:
        "200":
          description: Balance info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Balance could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/developer/apikey:
    get:
      operationId: getDeveloperApiKey
      tags: [developer]
      summary: Get developer API key
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      responses:
        "200":
          description: API key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: regenerateDeveloperApiKey
      tags: [developer]
      summary: Regenerate developer API key
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      responses:
        "200":
          description: New API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use an API key or session token in the Authorization header.
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: zynum_session
      description: Browser session cookie accepted by authenticated routes.
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code. The buy endpoint uses INSUFFICIENT_BALANCE when the account balance cannot cover the purchase.
        message:
          type: string
        balanceUsd:
          type: number
          description: Current account balance in USD, returned for INSUFFICIENT_BALANCE.
        requiredUsd:
          type: number
          description: Required account balance in USD, returned for INSUFFICIENT_BALANCE.
      required:
        - error
        - message

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        referralCode:
          type: string
        confirmPassword:
          type: string
      required:
        - name
        - email
        - password
        - confirmPassword

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token:
          type: string
      required:
        - user
        - token

    RegistrationResponse:
      type: object
      properties:
        requiresVerification:
          type: boolean
          enum: [true]
        email:
          type: string
          format: email
      required:
        - requiresVerification
        - email

    LoginResponse:
      oneOf:
        - $ref: "#/components/schemas/AuthResponse"
        - $ref: "#/components/schemas/LoginTwoFactorChallenge"
        - $ref: "#/components/schemas/AdminTwoFactorChallenge"

    LoginTwoFactorChallenge:
      type: object
      properties:
        requires2FA:
          type: boolean
          enum: [true]
        email:
          type: string
          format: email
      required:
        - requires2FA
        - email

    AdminTwoFactorChallenge:
      type: object
      properties:
        requiresAdmin2FA:
          type: boolean
          enum: [true]
        email:
          type: string
          format: email
      required:
        - requiresAdmin2FA
        - email

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
        isBanned:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - isAdmin
        - isBanned
        - createdAt

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        category:
          type: string
      required:
        - id
        - name
        - icon
        - color
        - category

    ServicesResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      required:
        - services

    Country:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        flag:
          type: string
        priceUsd:
          type: number
        priceFcfa:
          type: number
        available:
          type: integer
      required:
        - code
        - name
        - flag
        - priceUsd
        - priceFcfa
        - available

    CountriesResponse:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/Country"
      required:
        - countries

    Operator:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        priceUsd:
          type: number
        priceFcfa:
          type: number
        available:
          type: integer
      required:
        - name
        - label
        - priceUsd
        - priceFcfa
        - available

    OperatorsResponse:
      type: object
      properties:
        operators:
          type: array
          items:
            $ref: "#/components/schemas/Operator"
      required:
        - operators

    BuyNumberRequest:
      type: object
      properties:
        service:
          type: string
        country:
          type: string
        currency:
          type: string
          enum: [USD, FCFA]
          default: USD
        operator:
          type: string
        discountCode:
          type: string
      required:
        - service
        - country

    OrderStatus:
      type: string
      enum: [PENDING, RECEIVED, FINISHED, TIMEOUT, BANNED, CANCELED]

    Order:
      type: object
      properties:
        id:
          type: string
        externalId:
          type: string
          description: Opaque reference; use id for ZyNum order routes.
        phone:
          type: string
        service:
          type: string
        serviceName:
          type: string
        serviceIcon:
          type: string
        serviceColor:
          type: string
        country:
          type: string
        countryName:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        smsCode:
          type: [string, "null"]
        smsText:
          type: [string, "null"]
        priceUsd:
          type: number
        priceFcfa:
          type: number
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - externalId
        - phone
        - service
        - serviceName
        - serviceIcon
        - serviceColor
        - country
        - countryName
        - status
        - smsCode
        - smsText
        - priceUsd
        - priceFcfa
        - currency
        - createdAt
        - updatedAt

    OrderResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
      required:
        - order

    SmsStatusResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        autocanceled:
          type: boolean
        refundPending:
          type: boolean
      required:
        - order

    CheckRefundPendingResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        refundPending:
          type: boolean
          enum: [true]
        message:
          type: string
      required:
        - order
        - refundPending
        - message

    CancelOrderResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        refundPending:
          type: boolean
      required:
        - order
        - refundPending

    OrderHistoryResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - orders
        - total
        - page
        - limit

    BalanceResponse:
      type: object
      properties:
        balance:
          type: number
        currency:
          type: string
          enum: [USD]
      required:
        - balance
        - currency

    ApiKeyResponse:
      type: object
      properties:
        apiKey:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - apiKey
        - createdAt
